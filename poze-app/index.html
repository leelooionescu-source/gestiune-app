<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Poze cu Etichete</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏷️</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Nunito', sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    color: #2d3348;
  }
  .container { max-width: 1200px; margin: 0 auto; padding: 24px 16px 60px; }

  header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; margin-bottom: 20px; }
  header h1 { color: #fff; font-size: 1.6rem; font-weight: 800; text-shadow: 0 2px 8px rgba(0,0,0,.2); }
  header .actions { display: flex; gap: 8px; }

  .btn {
    border: none; border-radius: 10px; padding: 10px 16px; font-family: inherit;
    font-size: .95rem; font-weight: 700; cursor: pointer; transition: transform .1s, box-shadow .2s;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .btn:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(0,0,0,.18); }
  .btn-primary { background: #fff; color: #5b48c7; }
  .btn-ghost { background: rgba(255,255,255,.22); color: #fff; }
  .btn-danger { background: #e5484d; color: #fff; }
  .btn-sm { padding: 6px 10px; font-size: .85rem; border-radius: 8px; }

  .panel { background: #fff; border-radius: 16px; box-shadow: 0 8px 30px rgba(0,0,0,.15); padding: 16px; margin-bottom: 16px; }

  .dropzone {
    border: 2px dashed #b9b3e0; border-radius: 12px; padding: 22px; text-align: center;
    color: #6c6a8a; cursor: pointer; transition: background .2s, border-color .2s; font-weight: 600;
  }
  .dropzone.drag { background: #f0edff; border-color: #5b48c7; color: #5b48c7; }
  .dropzone .big { font-size: 1.8rem; display: block; margin-bottom: 4px; }

  .toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .search { flex: 1; min-width: 200px; position: relative; }
  .search input {
    width: 100%; padding: 10px 14px; border: 1.5px solid #e2e0f0; border-radius: 10px;
    font-family: inherit; font-size: .95rem; outline: none;
  }
  .search input:focus { border-color: #5b48c7; }

  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px; }
  .chip {
    border: none; border-radius: 999px; padding: 5px 12px; font-family: inherit; font-weight: 700;
    font-size: .82rem; cursor: pointer; color: #fff; opacity: .92; transition: transform .1s;
  }
  .chip:hover { transform: scale(1.05); opacity: 1; }
  .chip.all { background: #2d3348; }
  .chip.selected { outline: 3px solid #2d3348; outline-offset: 1px; }
  .chip small { font-weight: 600; opacity: .85; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 14px; }
  .card {
    background: #fff; border-radius: 14px; overflow: hidden; cursor: pointer;
    box-shadow: 0 4px 16px rgba(0,0,0,.14); transition: transform .15s, box-shadow .2s;
  }
  .card:hover { transform: translateY(-3px); box-shadow: 0 10px 26px rgba(0,0,0,.22); }
  .card img { width: 100%; height: 140px; object-fit: cover; display: block; background: #eee; }
  .card .info { padding: 8px 10px 10px; }
  .card .nume { font-size: .82rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card .taguri { margin-top: 5px; display: flex; gap: 4px; flex-wrap: wrap; }
  .mini-tag { border-radius: 999px; padding: 1.5px 8px; font-size: .68rem; font-weight: 700; color: #fff; }
  .mini-tag.none { background: #f0f0f5; color: #9a98b0; }

  .empty { text-align: center; color: #fff; padding: 60px 20px; font-size: 1.05rem; font-weight: 600; text-shadow: 0 1px 4px rgba(0,0,0,.2); }
  .empty .big { font-size: 3rem; display: block; margin-bottom: 10px; }

  /* ---------- modal ---------- */
  .overlay {
    position: fixed; inset: 0; background: rgba(20,18,40,.75); display: none;
    align-items: center; justify-content: center; padding: 16px; z-index: 50;
  }
  .overlay.open { display: flex; }
  .modal {
    background: #fff; border-radius: 18px; max-width: 980px; width: 100%; max-height: 92vh;
    overflow: auto; box-shadow: 0 20px 60px rgba(0,0,0,.4);
  }
  .modal-head { display: flex; justify-content: space-between; align-items: center; padding: 14px 18px; border-bottom: 1px solid #eee; gap: 10px; }
  .modal-head h2 { font-size: 1.05rem; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .close-x { background: #f2f1f8; border: none; border-radius: 8px; width: 34px; height: 34px; font-size: 1.1rem; cursor: pointer; font-weight: 700; color: #555; flex-shrink: 0; }
  .modal-body { display: grid; grid-template-columns: 1fr 300px; gap: 0; }
  @media (max-width: 760px) { .modal-body { grid-template-columns: 1fr; } }
  .viewer { position: relative; background: #14121f; display: flex; align-items: center; justify-content: center; min-height: 300px; }
  .viewer img { max-width: 100%; max-height: 62vh; display: block; }
  .nav-btn {
    position: absolute; top: 50%; transform: translateY(-50%); background: rgba(255,255,255,.85);
    border: none; border-radius: 50%; width: 38px; height: 38px; font-size: 1.15rem; cursor: pointer; font-weight: 700;
  }
  .nav-btn.prev { left: 10px; } .nav-btn.next { right: 10px; }
  .side { padding: 16px; }
  .side h3 { font-size: .85rem; text-transform: uppercase; letter-spacing: .04em; color: #8a88a3; margin: 14px 0 8px; }
  .side h3:first-child { margin-top: 0; }
  .tag-list { display: flex; gap: 6px; flex-wrap: wrap; }
  .tag-pill { border-radius: 999px; padding: 4px 10px; font-size: .8rem; font-weight: 700; color: #fff; display: inline-flex; align-items: center; gap: 6px; }
  .tag-pill button { background: rgba(255,255,255,.3); border: none; color: inherit; border-radius: 50%; width: 16px; height: 16px; font-size: .7rem; cursor: pointer; line-height: 1; padding: 0; }
  .muted { color: #9a98b0; font-size: .85rem; }
  .row { display: flex; gap: 6px; margin-top: 8px; }
  .row select, .row input[type=text], textarea {
    flex: 1; min-width: 0; padding: 8px 10px; border: 1.5px solid #e2e0f0; border-radius: 8px;
    font-family: inherit; font-size: .88rem; outline: none;
  }
  .row select:focus, .row input:focus, textarea:focus { border-color: #5b48c7; }
  input[type=color] { width: 40px; height: 37px; border: 1.5px solid #e2e0f0; border-radius: 8px; padding: 2px; cursor: pointer; background: #fff; flex-shrink: 0; }
  textarea { width: 100%; resize: vertical; margin-top: 4px; }
  .btn-purple { background: #5b48c7; color: #fff; }
  .side .footer-actions { margin-top: 16px; display: flex; gap: 8px; }
  .datum { font-size: .78rem; color: #9a98b0; margin-top: 12px; }

  /* tags manager */
  .tm-row { display: flex; gap: 6px; align-items: center; padding: 6px 0; border-bottom: 1px solid #f2f1f8; }
  .tm-row input[type=text] { flex: 1; padding: 7px 10px; border: 1.5px solid #e2e0f0; border-radius: 8px; font-family: inherit; font-size: .88rem; }
  .tm-count { font-size: .78rem; color: #9a98b0; width: 60px; text-align: right; }
  .modal.narrow { max-width: 520px; }
  .modal .pad { padding: 16px 18px; }

  .toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(80px);
    background: #2d3348; color: #fff; padding: 10px 20px; border-radius: 10px; font-weight: 700;
    font-size: .9rem; transition: transform .25s; z-index: 99; box-shadow: 0 8px 24px rgba(0,0,0,.3);
  }
  .toast.show { transform: translateX(-50%) translateY(0); }

  footer { text-align: center; color: rgba(255,255,255,.75); font-size: .8rem; margin-top: 30px; font-weight: 600; }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>🏷️ Poze cu Etichete</h1>
    <div class="actions">
      <button class="btn btn-ghost" id="btnTags">Gestionează etichetele</button>
      <button class="btn btn-primary" id="btnUpload">＋ Încarcă poze</button>
    </div>
  </header>

  <div class="panel">
    <div class="dropzone" id="dropzone">
      <span class="big">📷</span>
      Trage pozele aici sau apasă pentru a le alege
      <input type="file" id="fileInput" accept="image/*" multiple hidden>
    </div>
  </div>

  <div class="panel">
    <div class="toolbar">
      <div class="search">
        <input type="text" id="searchInput" placeholder="🔍 Caută după nume sau descriere...">
      </div>
    </div>
    <div class="chips" id="chips"></div>
  </div>

  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" style="display:none"></div>

  <footer>Pozele se salvează în acest browser, pe acest dispozitiv.</footer>
</div>

<!-- photo detail modal -->
<div class="overlay" id="detailOverlay">
  <div class="modal">
    <div class="modal-head">
      <h2 id="dNume"></h2>
      <button class="close-x" data-close="detailOverlay">✕</button>
    </div>
    <div class="modal-body">
      <div class="viewer">
        <img id="dImg" alt="">
        <button class="nav-btn prev" id="dPrev">‹</button>
        <button class="nav-btn next" id="dNext">›</button>
      </div>
      <div class="side">
        <h3>Etichete</h3>
        <div class="tag-list" id="dTags"></div>
        <div class="row" id="dExistingRow">
          <select id="dTagSelect"></select>
          <button class="btn btn-sm btn-purple" id="dTagAdd">Adaugă</button>
        </div>
        <div class="row">
          <input type="text" id="dNewTagName" placeholder="Etichetă nouă...">
          <input type="color" id="dNewTagColor" value="#5b48c7" title="Culoare">
          <button class="btn btn-sm btn-purple" id="dNewTagAdd">＋</button>
        </div>
        <h3>Descriere</h3>
        <textarea id="dDescriere" rows="3" placeholder="Adaugă o descriere..."></textarea>
        <div class="row">
          <button class="btn btn-sm btn-purple" id="dSaveDesc">Salvează descrierea</button>
        </div>
        <div class="footer-actions">
          <button class="btn btn-sm btn-ghost" style="background:#f2f1f8;color:#2d3348" id="dDownload">⬇ Descarcă</button>
          <button class="btn btn-sm btn-danger" id="dDelete">🗑 Șterge</button>
        </div>
        <div class="datum" id="dData"></div>
      </div>
    </div>
  </div>
</div>

<!-- tags manager modal -->
<div class="overlay" id="tagsOverlay">
  <div class="modal narrow">
    <div class="modal-head">
      <h2>Etichete</h2>
      <button class="close-x" data-close="tagsOverlay">✕</button>
    </div>
    <div class="pad">
      <div class="row" style="margin-top:0">
        <input type="text" id="tNewName" placeholder="Nume etichetă nouă...">
        <input type="color" id="tNewColor" value="#5b48c7" title="Culoare">
        <button class="btn btn-sm btn-purple" id="tNewAdd">Adaugă</button>
      </div>
      <div id="tList" style="margin-top:12px"></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
'use strict';

// ---------- IndexedDB ----------
const DB_NAME = 'poze-etichete';
let db;

function openDb() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = () => {
      const d = req.result;
      if (!d.objectStoreNames.contains('poze')) {
        d.createObjectStore('poze', { keyPath: 'id', autoIncrement: true });
      }
      if (!d.objectStoreNames.contains('etichete')) {
        d.createObjectStore('etichete', { keyPath: 'id', autoIncrement: true });
      }
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

function tx(store, mode, fn) {
  return new Promise((resolve, reject) => {
    const t = db.transaction(store, mode);
    const s = t.objectStore(store);
    const out = fn(s);
    t.oncomplete = () => resolve(out && out.result !== undefined ? out.result : undefined);
    t.onerror = () => reject(t.error);
  });
}

function getAll(store) {
  return new Promise((resolve, reject) => {
    const req = db.transaction(store, 'readonly').objectStore(store).getAll();
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

// ---------- state ----------
let poze = [];        // {id, nume, tip, original, thumb, descriere, etichete[], creat}
let etichete = [];    // {id, nume, culoare}
let filtruEticheta = null;
let cautare = '';
let curent = null;    // photo currently open in detail modal
const thumbUrls = new Map();
let viewUrl = null;

// ---------- helpers ----------
const $ = id => document.getElementById(id);

function toast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._h);
  t._h = setTimeout(() => t.classList.remove('show'), 2600);
}

function textColorFor(hex) {
  const n = parseInt(hex.slice(1), 16);
  const lum = 0.299 * (n >> 16 & 255) + 0.587 * (n >> 8 & 255) + 0.114 * (n & 255);
  return lum > 165 ? '#2d3348' : '#fff';
}

function thumbUrl(p) {
  if (!thumbUrls.has(p.id)) thumbUrls.set(p.id, URL.createObjectURL(p.thumb || p.original));
  return thumbUrls.get(p.id);
}

function makeThumb(file) {
  return new Promise(resolve => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      const max = 500;
      const scale = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(img.width * scale));
      c.height = Math.max(1, Math.round(img.height * scale));
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      c.toBlob(b => resolve(b), 'image/jpeg', 0.82);
    };
    img.onerror = () => { URL.revokeObjectURL(url); resolve(null); };
    img.src = url;
  });
}

function fmtData(ts) {
  return new Date(ts).toLocaleString('ro-RO', { dateStyle: 'long', timeStyle: 'short' });
}

// ---------- rendering ----------
function pozeFiltrate() {
  const q = cautare.toLowerCase();
  return poze.filter(p => {
    if (filtruEticheta !== null && !p.etichete.includes(filtruEticheta)) return false;
    if (q && !p.nume.toLowerCase().includes(q) && !(p.descriere || '').toLowerCase().includes(q)) return false;
    return true;
  }).sort((a, b) => b.creat - a.creat);
}

function renderChips() {
  const box = $('chips');
  box.innerHTML = '';
  if (!etichete.length && !poze.length) { box.style.display = 'none'; return; }
  box.style.display = 'flex';

  const all = document.createElement('button');
  all.className = 'chip all' + (filtruEticheta === null ? ' selected' : '');
  all.textContent = `Toate (${poze.length})`;
  all.onclick = () => { filtruEticheta = null; render(); };
  box.appendChild(all);

  for (const e of [...etichete].sort((a, b) => a.nume.localeCompare(b.nume, 'ro'))) {
    const cnt = poze.filter(p => p.etichete.includes(e.id)).length;
    const c = document.createElement('button');
    c.className = 'chip' + (filtruEticheta === e.id ? ' selected' : '');
    c.style.background = e.culoare;
    c.style.color = textColorFor(e.culoare);
    c.append(e.nume + ' ');
    const s = document.createElement('small');
    s.textContent = `(${cnt})`;
    c.appendChild(s);
    c.onclick = () => { filtruEticheta = filtruEticheta === e.id ? null : e.id; render(); };
    box.appendChild(c);
  }
}

function renderGrid() {
  const grid = $('grid');
  const empty = $('empty');
  const list = pozeFiltrate();
  grid.innerHTML = '';

  if (!list.length) {
    empty.style.display = 'block';
    empty.innerHTML = poze.length
      ? '<span class="big">🔍</span>Nicio poză nu corespunde filtrelor alese.'
      : '<span class="big">🖼️</span>Nicio poză încă. Încarcă primele poze mai sus!';
    return;
  }
  empty.style.display = 'none';

  for (const p of list) {
    const card = document.createElement('div');
    card.className = 'card';
    const img = document.createElement('img');
    img.src = thumbUrl(p);
    img.alt = p.nume;
    img.loading = 'lazy';
    const info = document.createElement('div');
    info.className = 'info';
    const nume = document.createElement('div');
    nume.className = 'nume';
    nume.textContent = p.nume;
    nume.title = p.nume;
    const tags = document.createElement('div');
    tags.className = 'taguri';
    const mele = etichete.filter(e => p.etichete.includes(e.id));
    if (mele.length) {
      for (const e of mele) {
        const t = document.createElement('span');
        t.className = 'mini-tag';
        t.style.background = e.culoare;
        t.style.color = textColorFor(e.culoare);
        t.textContent = e.nume;
        tags.appendChild(t);
      }
    } else {
      const t = document.createElement('span');
      t.className = 'mini-tag none';
      t.textContent = 'fără etichete';
      tags.appendChild(t);
    }
    info.append(nume, tags);
    card.append(img, info);
    card.onclick = () => openDetail(p.id);
    grid.appendChild(card);
  }
}

function render() {
  renderChips();
  renderGrid();
}

// ---------- upload ----------
async function handleFiles(files) {
  let ok = 0, bad = 0;
  for (const f of files) {
    if (!f.type.startsWith('image/')) { bad++; continue; }
    const thumb = await makeThumb(f);
    if (!thumb) { bad++; continue; }
    const rec = {
      nume: f.name, tip: f.type, original: f, thumb,
      descriere: '', etichete: [], creat: Date.now()
    };
    try {
      const id = await new Promise((resolve, reject) => {
        const t = db.transaction('poze', 'readwrite');
        const req = t.objectStore('poze').add(rec);
        req.onsuccess = () => resolve(req.result);
        t.onerror = () => reject(t.error);
      });
      rec.id = id;
      poze.push(rec);
      ok++;
    } catch (e) {
      bad++;
      console.error(e);
    }
  }
  if (ok) toast(`${ok} poză(e) încărcată(e) ✔`);
  if (bad) toast(`${bad} fișier(e) nu au putut fi încărcate (doar imagini)`);
  render();
}

// ---------- detail modal ----------
function openDetail(id) {
  const p = poze.find(x => x.id === id);
  if (!p) return;
  curent = p;
  $('dNume').textContent = p.nume;
  if (viewUrl) URL.revokeObjectURL(viewUrl);
  viewUrl = URL.createObjectURL(p.original);
  $('dImg').src = viewUrl;
  $('dDescriere').value = p.descriere || '';
  $('dData').textContent = 'Încărcată la: ' + fmtData(p.creat);
  renderDetailTags();
  $('detailOverlay').classList.add('open');
}

function renderDetailTags() {
  const p = curent;
  const box = $('dTags');
  box.innerHTML = '';
  const mele = etichete.filter(e => p.etichete.includes(e.id));
  if (!mele.length) {
    const m = document.createElement('span');
    m.className = 'muted';
    m.textContent = 'Nicio etichetă atașată.';
    box.appendChild(m);
  }
  for (const e of mele) {
    const pill = document.createElement('span');
    pill.className = 'tag-pill';
    pill.style.background = e.culoare;
    pill.style.color = textColorFor(e.culoare);
    pill.textContent = e.nume;
    const x = document.createElement('button');
    x.textContent = '✕';
    x.title = 'Elimină eticheta';
    x.onclick = async () => {
      p.etichete = p.etichete.filter(i => i !== e.id);
      await savePoza(p);
      renderDetailTags(); render();
    };
    pill.appendChild(x);
    box.appendChild(pill);
  }
  const sel = $('dTagSelect');
  sel.innerHTML = '<option value="">-- alege etichetă --</option>';
  const rest = etichete.filter(e => !p.etichete.includes(e.id))
    .sort((a, b) => a.nume.localeCompare(b.nume, 'ro'));
  for (const e of rest) {
    const o = document.createElement('option');
    o.value = e.id;
    o.textContent = e.nume;
    sel.appendChild(o);
  }
  $('dExistingRow').style.display = rest.length ? 'flex' : 'none';
}

function savePoza(p) {
  return tx('poze', 'readwrite', s => s.put(p));
}

async function creeazaEticheta(nume, culoare) {
  const exist = etichete.find(e => e.nume.toLowerCase() === nume.toLowerCase());
  if (exist) return exist;
  const rec = { nume, culoare };
  rec.id = await new Promise((resolve, reject) => {
    const t = db.transaction('etichete', 'readwrite');
    const req = t.objectStore('etichete').add(rec);
    req.onsuccess = () => resolve(req.result);
    t.onerror = () => reject(t.error);
  });
  etichete.push(rec);
  return rec;
}

function navigheaza(dir) {
  const list = pozeFiltrate();
  if (!curent || list.length < 2) return;
  const i = list.findIndex(p => p.id === curent.id);
  if (i === -1) return;
  const next = list[(i + dir + list.length) % list.length];
  openDetail(next.id);
}

// ---------- tags manager ----------
function renderTagsManager() {
  const box = $('tList');
  box.innerHTML = '';
  if (!etichete.length) {
    box.innerHTML = '<div class="muted" style="padding:8px 0">Nicio etichetă creată încă.</div>';
    return;
  }
  for (const e of [...etichete].sort((a, b) => a.nume.localeCompare(b.nume, 'ro'))) {
    const row = document.createElement('div');
    row.className = 'tm-row';
    const name = document.createElement('input');
    name.type = 'text';
    name.value = e.nume;
    const color = document.createElement('input');
    color.type = 'color';
    color.value = e.culoare;
    const cnt = document.createElement('span');
    cnt.className = 'tm-count';
    cnt.textContent = poze.filter(p => p.etichete.includes(e.id)).length + ' poze';
    const save = document.createElement('button');
    save.className = 'btn btn-sm btn-purple';
    save.textContent = '💾';
    save.title = 'Salvează';
    save.onclick = async () => {
      const n = name.value.trim();
      if (!n) { toast('Numele nu poate fi gol'); return; }
      e.nume = n; e.culoare = color.value;
      await tx('etichete', 'readwrite', s => s.put(e));
      toast('Etichetă salvată ✔');
      renderTagsManager(); render();
    };
    const del = document.createElement('button');
    del.className = 'btn btn-sm btn-danger';
    del.textContent = '🗑';
    del.title = 'Șterge';
    del.onclick = async () => {
      if (!confirm(`Ștergi eticheta „${e.nume}"? Va fi eliminată de pe toate pozele.`)) return;
      await tx('etichete', 'readwrite', s => s.delete(e.id));
      etichete = etichete.filter(x => x.id !== e.id);
      for (const p of poze) {
        if (p.etichete.includes(e.id)) {
          p.etichete = p.etichete.filter(i => i !== e.id);
          await savePoza(p);
        }
      }
      if (filtruEticheta === e.id) filtruEticheta = null;
      renderTagsManager(); render();
    };
    row.append(name, color, cnt, save, del);
    box.appendChild(row);
  }
}

// ---------- events ----------
$('btnUpload').onclick = () => $('fileInput').click();
$('dropzone').onclick = () => $('fileInput').click();
$('fileInput').onchange = e => { handleFiles([...e.target.files]); e.target.value = ''; };

const dz = $('dropzone');
['dragenter', 'dragover'].forEach(ev => dz.addEventListener(ev, e => { e.preventDefault(); dz.classList.add('drag'); }));
['dragleave', 'drop'].forEach(ev => dz.addEventListener(ev, e => { e.preventDefault(); dz.classList.remove('drag'); }));
dz.addEventListener('drop', e => handleFiles([...e.dataTransfer.files]));

$('searchInput').oninput = e => { cautare = e.target.value.trim(); render(); };

document.querySelectorAll('[data-close]').forEach(b => {
  b.onclick = () => $(b.dataset.close).classList.remove('open');
});
document.querySelectorAll('.overlay').forEach(o => {
  o.addEventListener('mousedown', e => { if (e.target === o) o.classList.remove('open'); });
});
document.addEventListener('keydown', e => {
  if ($('detailOverlay').classList.contains('open')) {
    if (e.key === 'Escape') $('detailOverlay').classList.remove('open');
    if (e.key === 'ArrowLeft') navigheaza(-1);
    if (e.key === 'ArrowRight') navigheaza(1);
  } else if (e.key === 'Escape') {
    $('tagsOverlay').classList.remove('open');
  }
});
$('dPrev').onclick = () => navigheaza(-1);
$('dNext').onclick = () => navigheaza(1);

$('dTagAdd').onclick = async () => {
  const v = parseInt($('dTagSelect').value);
  if (!v || !curent) return;
  curent.etichete.push(v);
  await savePoza(curent);
  renderDetailTags(); render();
};

$('dNewTagAdd').onclick = async () => {
  const n = $('dNewTagName').value.trim();
  if (!n || !curent) { toast('Scrie numele etichetei'); return; }
  const e = await creeazaEticheta(n, $('dNewTagColor').value);
  if (!curent.etichete.includes(e.id)) {
    curent.etichete.push(e.id);
    await savePoza(curent);
  }
  $('dNewTagName').value = '';
  renderDetailTags(); render();
};

$('dSaveDesc').onclick = async () => {
  if (!curent) return;
  curent.descriere = $('dDescriere').value.trim();
  await savePoza(curent);
  toast('Descriere salvată ✔');
  render();
};

$('dDownload').onclick = () => {
  if (!curent) return;
  const a = document.createElement('a');
  a.href = URL.createObjectURL(curent.original);
  a.download = curent.nume;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
};

$('dDelete').onclick = async () => {
  if (!curent) return;
  if (!confirm(`Ștergi poza „${curent.nume}"?`)) return;
  await tx('poze', 'readwrite', s => s.delete(curent.id));
  const url = thumbUrls.get(curent.id);
  if (url) { URL.revokeObjectURL(url); thumbUrls.delete(curent.id); }
  poze = poze.filter(p => p.id !== curent.id);
  curent = null;
  $('detailOverlay').classList.remove('open');
  toast('Poză ștearsă');
  render();
};

$('btnTags').onclick = () => { renderTagsManager(); $('tagsOverlay').classList.add('open'); };

$('tNewAdd').onclick = async () => {
  const n = $('tNewName').value.trim();
  if (!n) { toast('Scrie numele etichetei'); return; }
  await creeazaEticheta(n, $('tNewColor').value);
  $('tNewName').value = '';
  renderTagsManager(); render();
};

// ---------- init ----------
(async () => {
  db = await openDb();
  [poze, etichete] = await Promise.all([getAll('poze'), getAll('etichete')]);
  render();
})();
</script>
</body>
</html>
